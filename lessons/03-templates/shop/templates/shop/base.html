<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Shop{% endblock %}</title>
    <style>
        :root {
            --django-green: #0c4b33;
            --django-teal: #44b78b;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f8f8;
            color: #333;
        }
        header {
            background: var(--django-green);
            color: #fff;
            padding: 1rem 1.5rem;
        }
        header h1 { margin: 0 0 0.5rem; }
        nav a {
            color: var(--django-teal);
            text-decoration: none;
            margin-right: 0.75rem;
        }
        nav a:hover { color: #fff; }
        main {
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 1.5rem 2rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        h2 { color: var(--django-green); }
    </style>
</head>
<body>
    <header>
        <h1>Django Shop</h1>
        <nav>
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'about' %}">О сайте</a>
            <a href="{% url 'contact' %}">Контакты</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Django Shop - учебный проект. Создано: Roman</p>
    </footer>
</body>
</html>
